name: Public viewer

on:
  pull_request:
    paths:
      - "public-site/**"
      - ".github/workflows/public-site.yml"
  push:
    branches: [main]
    paths:
      - "public-site/**"
      - ".github/workflows/public-site.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test public-site/*.test.*
