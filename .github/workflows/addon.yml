# Home Assistant add-on tests and a Docker build for app, asset, and preparation changes.
name: Add-on

on:
  pull_request:
    paths:
      - "homeassistant/**"
      - "public-site/worker.js"
      - "public-site/title.test.mjs"
      - "shared/**"
      - "tools/generate_animation.py"
      - "docs/animation-atlases/**"
      - "docs/animation-preparation.md"
  push:
    branches: [main]
    paths:
      - "homeassistant/**"
      - "public-site/worker.js"
      - "public-site/title.test.mjs"
      - "shared/**"
      - "tools/generate_animation.py"
      - "docs/animation-atlases/**"
      - "docs/animation-preparation.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r homeassistant/ryciny/app/requirements.txt pytest
      - run: python -m pytest -q homeassistant/ryciny/tests
      - run: node --test homeassistant/ryciny/tests/animation.test.cjs homeassistant/ryciny/tests/location.test.cjs public-site/title.test.mjs
      - name: Docker build (amd64)
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:bookworm -t ryciny-ha homeassistant/ryciny
