name: Ryciny
version: "0.10.2"
slug: ryciny
description: Ptaki, psy, samoloty, pociągi i dźwięki okolicy jako XIX-wieczne ryciny. Słucha mikrofonu, aplikacja tylko wyświetla.
url: https://github.com/qunabu/ryciny
arch:
  - aarch64
  - amd64
init: false
audio: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:bird
panel_title: Ryciny
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: API dla aplikacji Ryciny i strona z ryciną
options:
  image_provider: openai
  openai_key: ""
  openai_model: gpt-image-1
  gemini_key: ""
  gemini_model: gemini-2.5-flash-image
  openrouter_key: ""
  openrouter_model: google/gemini-2.5-flash-image
  bird_threshold: 0.7
  range_filter: true
  bark_threshold: 0.35
  dog_match: 0.85
  radius_km: 15
  overhead_max_alt_m: 3500
  trains: true
  sounds_off:
    - sheep
    - goat
schema:
  lat: float?
  lon: float?
  image_provider: list(openai|gemini|openrouter|none)
  openai_key: password?
  openai_model: str
  gemini_key: password?
  gemini_model: str
  openrouter_key: password?
  openrouter_model: str
  bird_threshold: float(0.3,0.95)
  range_filter: bool
  bark_threshold: float(0.1,0.9)
  dog_match: float(0.6,0.98)
  radius_km: float(3,60)
  overhead_max_alt_m: int(500,12000)
  trains: bool
  sounds_off:
    - str
  audio_command: str?
