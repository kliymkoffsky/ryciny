configuration:
  lat:
    name: Szerokość geograficzna
    description: Pusta = lokalizacja z Home Assistant. Do filtra gatunków ptaków, samolotów i pociągów.
  lon:
    name: Długość geograficzna
    description: Pusta = lokalizacja z Home Assistant.
  image_provider:
    name: Generowanie rycin
    description: Kto rysuje ryciny samolotów, psów i dźwięków (ptaki mają gotowe tablice z fugleramme).
  openai_key:
    name: Klucz OpenAI
  gemini_key:
    name: Klucz Google Gemini
  openrouter_key:
    name: Klucz OpenRouter
  frame_on:
    name: Samsung The Frame
    description: Wysyłaj na telewizor rycinę tego, co słychać, z opisem i statystykami (Art Mode, 4K). Można też włączyć w panelu.
  frame_host:
    name: Adres IP telewizora
    description: Np. 192.168.1.14. Przy pierwszym razie telewizor zapyta, czy wpuścić „Ryciny”; zezwól pilotem.
  frame_every_min:
    name: Nie częściej niż co (min)
  public_url:
    name: Strona publiczna (adres Workera)
    description: Opcjonalnie. Co 3 minuty wysyła ptaki, usłyszane samoloty i dźwięki okolicy (bez audio, psów, mowy i lokalizacji) do Workera z public-site/.
  public_token:
    name: Token strony publicznej
    description: Ten sam co sekret INGEST_TOKEN Workera.
  art_daily_limit:
    name: Dzienny limit generowanych rycin
    description: Najwyżej tyle płatnych rycin (OpenAI, Gemini, OpenRouter) na dobę; 0 = bez limitu. Ptaki z fugleramme się nie liczą.
  mic_gain_db:
    name: Wzmocnienie mikrofonu (dB)
    description: Cichy mikrofon za oknem — samoloty rozpoznawane są dopiero od ok. -40 dB; zwykle 12–24 dB. Można też ustawiać w panelu.
  bird_threshold:
    name: Minimalna pewność BirdNET
  range_filter:
    name: Tylko gatunki występujące tu o tej porze roku
  bark_threshold:
    name: Próg szczekania
  dog_match:
    name: Dopasowanie do znanego psa
  radius_km:
    name: Promień samolotów (km)
  overhead_max_alt_m:
    name: „Nad głową” poniżej (m)
  trains:
    name: Rozpoznawaj pociągi z rozkładu (30 MB raz na 3 dni)
  sounds_off:
    name: Wyłączone dźwięki
    description: Klucze z shared/sounds.json, np. sheep, goat, music.
  audio_command:
    name: Polecenie nagrywania
    description: Domyślnie parec z mikrofonu Home Assistant (48 kHz, mono, float32).
