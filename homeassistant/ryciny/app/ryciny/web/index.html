<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ryciny</title>
<style>
@font-face{font-family:Garamond;src:url(fonts/garamond.ttf)}
@font-face{font-family:Garamond;font-style:italic;src:url(fonts/garamond_italic.ttf)}
:root{--paper:#f3ead7;--paper2:#e6d9bc;--ink:#2b2118;--soft:#6b5b4a;--rubric:#9c3b2a}
*{box-sizing:border-box}
input{accent-color:var(--rubric)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Garamond,Georgia,serif;font-size:18px}
nav{display:flex;gap:4px;justify-content:center;background:var(--paper2);position:sticky;top:0;z-index:2}
nav button{font:inherit;background:none;border:0;padding:12px 18px;color:var(--soft);cursor:pointer}
@media(max-width:480px){nav{gap:0}nav button{padding:12px 10px}}
nav button.on{color:var(--ink);border-bottom:2px solid var(--rubric)}
main{max-width:1000px;margin:0 auto;padding:16px}
.frame{border:1px solid rgba(43,33,24,.45);outline:1px solid rgba(43,33,24,.25);outline-offset:-6px;padding:18px;background:var(--paper)}
.plate{position:relative}
.plate img{width:100%;height:auto;display:block}
.plate>img[hidden]{display:block;visibility:hidden}
.plate-animation{position:absolute;inset:18px;overflow:hidden;pointer-events:none}
.plate-animation[hidden]{display:none}
.animation-background{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}
.animation-sprite{position:absolute;overflow:hidden}
.animation-sprite__track{position:absolute;left:0;top:0;width:600%;height:100%;max-width:none;display:block;object-fit:fill;animation:none;transform:translateX(0)}
.animation-sprite.is-playing .animation-sprite__track{animation:ryciny-sprite var(--animation-duration,900ms) steps(6,end) infinite}
@keyframes ryciny-sprite{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.animation-sprite__track{animation:none!important;transform:translateX(0)!important}}
.plate-animation-toggle{display:block;margin:10px auto 0}
#plateAnimationToggle[hidden]{display:none}
.soft{color:var(--soft);font-style:italic}
.live{text-align:center;margin:12px 0;color:var(--rubric);font-style:italic}
h2{font-weight:normal;color:var(--rubric);margin:22px 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.chips button{font:inherit;font-size:16px;border:1px solid var(--soft);background:none;border-radius:16px;padding:3px 12px;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--paper2)}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(107,91,74,.2)}
.row .t{flex:1}
.row .d{color:var(--soft);font-style:italic;font-size:15px}
.thumb{width:64px;height:64px;object-fit:contain;flex:none}
.thumb.empty{border:1px solid rgba(107,91,74,.3);transform:scale(.6)}
div.thumb{display:block}
.element-art{position:relative;display:block;overflow:hidden}
.element-art__still{width:100%;height:100%;object-fit:contain}
.element-art__motion{position:absolute;inset:0;display:block}
.element-art [hidden]{display:none!important}
button.act{font:inherit;font-size:16px;color:var(--rubric);background:none;border:0;cursor:pointer}
label.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
input[type=range]{width:50%}
input,select{font:inherit}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{border:1px solid rgba(107,91,74,.3);padding:8px;text-align:center}
.stat b{display:block;font-size:28px;color:var(--rubric)}
.bar{height:7px;background:var(--rubric);opacity:.75}
.hours{display:flex;align-items:flex-end;gap:2px;height:80px;border-bottom:1px solid rgba(107,91,74,.4)}
.hours div{flex:1;background:var(--rubric);opacity:.7;min-height:1px}
.hlab{display:flex;justify-content:space-between;color:var(--soft);font-size:13px}
.tag{background:var(--paper2);padding:10px;margin:6px 0 10px 76px}
code{font-size:14px}
.mic{text-align:center;margin:18px auto;max-width:520px}
.meter{height:12px;border:1px solid var(--soft);margin:8px 0;background:#fff8}
#meterBar{height:100%;width:0;background:var(--rubric);transition:width .4s}
.location-fields{border:0;padding:0;margin:0;min-width:0}
.location-fields label{display:block;margin:8px 0}
.location-fields input{width:100%;max-width:460px;padding:9px;border:1px solid var(--soft);background:#fff6;color:var(--ink);border-radius:3px}
.location-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.location-actions button{font:inherit;padding:8px 12px;border:1px solid var(--soft);background:var(--paper2);color:var(--ink);cursor:pointer;border-radius:3px}
.location-actions button[type=submit]{background:var(--rubric);color:var(--paper);border-color:var(--rubric)}
.location-actions button:disabled{opacity:.5;cursor:wait}
.settings-status.error{color:var(--rubric);font-style:normal}
</style>
</head>
<body>
<nav>
  <button data-tab="plate" class="on">Rycina</button>
  <button data-tab="journal">Dziennik</button>
<button data-tab="stats">Statystyki</button>
  <button data-tab="settings">Ustawienia</button>
</nav>
<main>
  <section id="plate">
    <div class="frame plate" id="plateSurface">
      <img id="plateImg" alt="Rycina">
      <div id="plateAnimation" class="plate-animation" role="img" aria-label="Rycina" hidden aria-hidden="true"></div>
    </div>
    <button class="act plate-animation-toggle" id="plateAnimationToggle" type="button" hidden>Odtwórz animację</button>
    <div class="live" id="live"></div>
    <div class="mic">
      <b>Test mikrofonu</b>
      <div class="meter"><div id="meterBar"></div></div>
      <span id="micDb" class="soft"></span>
      <button class="act" id="micPlay" data-audio-src="api/mic.wav">▶ Odsłuchaj ostatnie 3 s</button>
      <p class="soft" id="micHint"></p>
    </div>
  </section>
  <section id="journal" hidden>
    <div class="chips" id="filters"></div>
    <div id="dogs"></div>
    <div id="entries"></div>
  </section>
  <section id="stats" hidden></section>
<section id="settings" hidden></section>
</main>
<script src="animation.js"></script>
<script src="location.js"></script>
<script>
const $ = s => document.querySelector(s);
const api = (p, o) => fetch(p, o).then(r => r.ok ? r.json() : Promise.reject(r.status));
const hhmm = t => new Date(t).toLocaleTimeString('pl-PL', {hour: '2-digit', minute: '2-digit'});
const day = t => new Date(t).toLocaleDateString('pl-PL', {day: 'numeric', month: 'short'});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let journal = null, sounds = {}, breeds = [], filter = 'all', version = -1, animationRevision = -1;
let tickInFlight = false;
let settingsSaveTail = Promise.resolve();
let pollTimer = null;

const tryAnimation = new URLSearchParams(location.search).get('animation') !== 'off';
const plateAnimation = new window.RycinyAnimation.Player({
  container: $('#plateAnimation'),
  staticImage: $('#plateImg'),
  toggle: $('#plateAnimationToggle'),
  endpoint: 'api/plate-animation?w=1600&h=900',
  enabled: tryAnimation,
  autoPlay: true,
});
const elementAnimations = new window.RycinyAnimation.Manager({
  root: document, enabled: tryAnimation,
});

function show(tab) {
  elementAnimations.stopAll();
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== tab);
  plateAnimation.setActive(tab === 'plate');
  elementAnimations.setActive(tab !== 'plate');
  if (tab === 'plate') tick();
  if (tab === 'settings') renderSettings().then(frameStatus);
  if (tab === 'stats') renderStats();
  history.replaceState(null, '', '#' + tab);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.tab));
window.addEventListener('hashchange', () => {
  const tab = location.hash.slice(1);
  if (['plate', 'journal', 'stats', 'settings'].includes(tab)) show(tab);
});

async function tick() {
  if (tickInFlight) return;
  tickInFlight = true;
  try {
    const l = await api('api/live');
    $('#live').textContent = (l.live.listening ? '● nasłuch trwa' : '○ nasłuch wyłączony') +
      (l.live.sound ? ' · słychać: ' + l.live.sound : '') + (l.live.error ? ' · ' + l.live.error : '') +
      (l.artError ? ' · ' + l.artError : '');
    const db = l.mic ? l.mic.db : -120;
    $('#meterBar').style.width = Math.max(0, Math.min(100, (db + 70) * 100 / 60)) + '%';
    $('#micDb').textContent = l.mic && l.mic.has ? `poziom ${db} dB, szczyt ${Math.round((l.mic.peak || 0) * 100)}%` : 'czekam na pierwsze 3 s nagrania…';
    $('#micHint').textContent = !l.mic || !l.mic.has ? '' : db < -60 ? 'Prawie cisza: sprawdź wejście w zakładce Audio dodatku i różowe gniazdo przejściówki.'
      : (l.mic.peak || 0) > 0.98 ? 'Przester: mikrofon za blisko hałasu albo za duże wzmocnienie.' : 'Sygnał dochodzi. Zagwiżdż albo klaśnij i odsłuchaj.';
    if (l.version !== version || (l.animationRevision || 0) !== animationRevision) {
      version = l.version;
      animationRevision = l.animationRevision || 0;
      $('#plateImg').src = 'api/plate.png?w=1600&h=900&a=' + animationRevision + '&v=' + version;
      plateAnimation.refresh();
      journal = await api('api/journal');
      renderJournal();
      if (!$('#stats').hidden) renderStats();
    } else if (!plateAnimation.ready && !$('#plate').hidden) plateAnimation.refresh();
  } catch (e) { $('#live').textContent = 'brak połączenia z dodatkiem'; }
  finally { tickInFlight = false; }
}

function art(kind, key, subject, extra = '') {
  const cached = kind === 'BIRD' ? '' : '&cached=1';
  return `<span class="thumb element-art" data-animation-kind="${esc(kind)}" data-animation-key="${esc(key)}"><img class="element-art__still" alt="" loading="lazy" src="api/art?kind=${kind}&key=${encodeURIComponent(key)}&subject=${encodeURIComponent(subject)}${extra}${cached}&a=${animationRevision}" onerror="this.hidden=true;this.parentElement.classList.add('empty')"><span class="element-art__motion" hidden></span></span>`;
}

// Recordings of what was detected (kept 14 days on the add-on's disk).
const play = (clip, best = false) => /^[0-9a-f]{8}\.(?:wav|mp3)$/.test(clip || '')
  ? `<button class="act" title="${best ? 'Odsłuchaj najlepsze nagranie' : 'Odsłuchaj'}" aria-label="Odsłuchaj" data-audio-src="api/${best ? 'best' : 'clips'}/${clip}">▶</button>` : '';

function renderJournal() {
  if (!journal) return;
  elementAnimations.stopAll();
  const f = [['all', 'wszystko'], ['birds', 'ptaki'], ['dogs', 'psy'], ['planes', 'samoloty'], ['sounds', 'dźwięki']];
  $('#filters').innerHTML = f.map(([k, l]) => `<button class="${k === filter ? 'on' : ''}" data-f="${k}">${l}</button>`).join('');
  $('#filters').querySelectorAll('button').forEach(b => b.onclick = () => { filter = b.dataset.f; renderJournal(); });
  const dogs = Object.fromEntries(journal.dogs.map(d => [d.id, d]));
  const rows = [];
  if (filter === 'all' || filter === 'birds') journal.birds.forEach(b => rows.push({at: b.lastAt, html:
    `<div class="row">${art('BIRD', b.sci, b.sci)}<div class="t">${esc(b.name.charAt(0).toUpperCase() + b.name.slice(1))}<div class="d">${day(b.lastAt)} ${hhmm(b.lastAt)} · ${esc(b.sci)} · ${Math.round(b.conf * 100)}%${b.count > 1 ? ' · ' + b.count + '×' : ''}</div></div>${play(b.clip)}</div>`}));
  if (filter === 'all' || filter === 'dogs') journal.barks.forEach(b => {
    const d = dogs[b.dogId];
    const breed = d ? [d.breed, d.breedEn] : mongrel(b.size);
    rows.push({at: b.lastAt, html:
      `<div class="row">${art('DOG', breed[0], breed[1])}<div class="t">${d ? esc(d.name + ' (' + d.breed + ')') : 'Szczekanie: nieznany pies' + (b.size !== '?' ? ', raczej ' + b.size : '')}<div class="d">${day(b.lastAt)} ${hhmm(b.lastAt)} · ${b.count}× · pewność ${Math.round(b.score * 100)}%${b.pitchHz > 0 ? ' · ok. ' + Math.round(b.pitchHz) + ' Hz' : ''}</div></div>` +
      play(b.clip) +
      `<button class="act" onclick="tagForm('${b.id}', this)">${d ? 'Zmień' : 'Kto to?'}</button></div>`});
  });
  if (filter === 'all' || filter === 'planes') journal.planes.filter(p => p.heard).forEach(p => rows.push({at: p.lastAt, html:
    `<div class="row">${art('PLANE', (p.typeCode || p.title) + '-' + (p.airlineIcao || p.airline || 'plain'), p.title, '&airline=' + encodeURIComponent(p.airline))}<div class="t">${esc(p.title)} · ${esc(p.callsign)}<div class="d">${day(p.lastAt)} ${hhmm(p.lastAt)} · ${esc([p.airline, p.route].filter(Boolean).join(' · '))} · ${p.minDistKm.toFixed(1)} km${p.minAltM != null ? ', ' + p.minAltM + ' m' : ''}</div></div></div>`}));
  if (filter === 'all' || filter === 'sounds') journal.sounds.forEach(e => {
    const s = sounds[e.key];
    if (!s || !s.on) return;
    const key = e.variant ? e.key + '-' + e.variant : e.key;
    rows.push({at: e.lastAt, html:
      `<div class="row">${art('SCENE', key, s.now)}<div class="t">${esc(s.past)}${e.title ? ': ' + esc(e.title) : ''}<div class="d">${day(e.at)} ${hhmm(e.at)}–${hhmm(e.lastAt)}${e.subtitle ? ' · ' + esc(e.subtitle) : ''}</div></div>${play(e.clip)}</div>`});
  });
  rows.sort((a, b) => b.at - a.at);
  $('#entries').innerHTML = rows.slice(0, 400).map(r => r.html).join('') || '<p class="soft">Jeszcze pusto.</p>';
  $('#dogs').innerHTML = filter !== 'dogs' ? '' : journal.dogs.length === 0
    ? '<p class="soft">Rasy nie da się odczytać z samego szczekania. Przy szczekaniu naciśnij „Kto to?” i podaj imię i rasę psa: od tej pory dodatek rozpozna go sam.</p>'
    : journal.dogs.map(d => `<div class="row">${art('DOG', d.breed, d.breedEn)}<div class="t">${esc(d.name)}<div class="d">${esc(d.breed)} · próbek: ${d.samples.length}</div></div><button class="act" onclick="deleteDog('${d.id}')">Usuń</button></div>`).join('') + '<h2>Szczekania</h2>';
  elementAnimations.refresh($('#journal'));
}

function mongrel(size) {
  const i = size === 'duży' ? 2 : size === 'mały' ? 0 : 1;
  return breeds[i] ? [breeds[i].pl, breeds[i].en] : ['Kundel średni', 'a medium-sized mixed-breed dog'];
}

function tagForm(barkId, btn) {
  document.querySelectorAll('.tag').forEach(x => x.remove());
  const known = journal.dogs.map(d => `<button class="act" onclick="tag('${barkId}','${d.id}')">${esc(d.name)} (${esc(d.breed)})</button>`).join(' ');
  const div = document.createElement('div');
  div.className = 'tag';
  div.innerHTML = (known ? 'Znane psy: ' + known + '<br>' : '') +
    `Nowy pies: <input id="dn" placeholder="imię, np. Burek zza płotu"> <select id="db">${breeds.map(b => `<option>${esc(b.pl)}</option>`).join('')}</select> <button class="act" onclick="newDog('${barkId}')">Zapisz</button>`;
  btn.closest('.row').after(div);
}
async function tag(barkId, dogId) { await api(`api/barks/${barkId}/tag`, {method: 'POST', body: JSON.stringify({dogId})}); version = -1; tick(); }
async function newDog(barkId) {
  const breed = breeds.find(b => b.pl === $('#db').value);
  const {id} = await api('api/dogs', {method: 'POST', body: JSON.stringify({name: $('#dn').value || breed.pl, breed: breed.pl, breedEn: breed.en})});
  tag(barkId, id);
}
async function deleteDog(id) { await fetch('api/dogs/' + id, {method: 'DELETE'}); version = -1; tick(); }

function setSettingsStatus(message, error = false) {
  const element = $('#settingsStatus');
  if (!element) return;
  element.textContent = message || '';
  element.classList.toggle('error', Boolean(error));
}

function animationGenerationMessage(state) {
  if (state?.animationKeyReady) {
    return 'Generowanie korzysta z klucza OpenAI ustawionego w konfiguracji dodatku.';
  }
  return 'Brak klucza OpenAI. Ustaw go w konfiguracji dodatku (Ustawienia → Dodatki → Ryciny → Konfiguracja). Zaznaczenie zostanie zapisane, ale generowanie animacji nie wykona płatnych wywołań.';
}

function syncSettingsControls(state) {
  /*
   * PUT returns the canonical runtime state; applying it to live controls keeps
   * autosave safe when the backend normalizes or rejects a requested value.
   */

  if (!state || typeof state !== 'object') return;
  Object.entries(state).forEach(([key, value]) => {
    const input = document.getElementById('setting_' + key);
    if (!input) return;
    const stringValue = String(value ?? '');
    if (input.tagName === 'SELECT' && !Array.from(input.options).some(option => option.value === stringValue)) {
      const option = document.createElement('option');
      option.value = stringValue;
      option.textContent = 'Niestandardowy (' + stringValue + ')';
      input.appendChild(option);
    }
    if (input.type === 'checkbox') input.checked = Boolean(value);
    else input.value = stringValue;
    const display = document.getElementById('v_' + key);
    if (display) display.textContent = input.dataset.displayFormat === 'percent'
      ? Math.round(Number(value) * 100) + '%'
      : stringValue;
  });
  const savedLocation = $('#savedLocation');
  if (savedLocation && Number.isFinite(state.lat) && Number.isFinite(state.lon)) {
    savedLocation.textContent = `${state.lat.toFixed(3)}, ${state.lon.toFixed(3)}`;
  }
  const generationStatus = $('#animationGenerationStatus');
  if (generationStatus) generationStatus.textContent = animationGenerationMessage(state);
}

function applyAnimationPlayback(enabled) {
  plateAnimation.setEnabled(enabled && tryAnimation);
  elementAnimations.setEnabled(enabled && tryAnimation);
  version = -1;
  if (!$('#plate').hidden) tick();
}

async function renderSettings() {
  const s = await api('api/settings');
  const list = await api('api/sounds');
  const pct = v => Math.round(v * 100) + '%';
  const slider = (k, label, min, max, step, fmt = v => v) =>
    `<label class="set">${label}: <b id="v_${k}">${fmt(s[k])}</b><input id="setting_${k}" data-display-format="${fmt === pct ? 'percent' : ''}" type="range" min="${min}" max="${max}" step="${step}" value="${s[k]}" oninput="document.getElementById('v_${k}').textContent=(${fmt.toString()})(+this.value)" onchange="save({${k}: +this.value})"></label>`;
  const toggle = (k, label) => `<label class="set">${label}<input id="setting_${k}" type="checkbox" ${s[k] ? 'checked' : ''} onchange="save({${k}: this.checked})"></label>`;
  const modelOptions = [['gpt-image-2.5-sunburst', 'Sunburst (gpt-image-2.5-sunburst)'], ['gpt-image-2.5-flare', 'Flare (gpt-image-2.5-flare)']];
  const currentModel = String(s.animation_model || modelOptions[0][0]);
  if (!modelOptions.some(([value]) => value === currentModel)) modelOptions.push([currentModel, 'Niestandardowy (' + currentModel + ')']);
  $('#settings').innerHTML = `
    <p class="soft settings-status" id="settingsStatus" role="status" aria-live="polite"></p>
    <h2>Tytuł publicznej strony</h2>
    <form id="stationTitleForm">
      <fieldset class="location-fields">
        <label for="stationTitleInput">Nazwa nasłuchu</label>
        <input id="stationTitleInput" name="station_title" type="text" required maxlength="120" autocomplete="off" aria-describedby="stationTitleHint stationTitleStatus">
        <p id="stationTitleHint" class="soft">Ten tytuł pojawi się na publicznej stronie i w karcie przeglądarki. Jej adres pozostanie ten sam.</p>
        <div class="location-actions"><button type="submit">Zapisz tytuł</button><button type="reset">Cofnij</button></div>
      </fieldset>
      <p id="stationTitleStatus" class="soft settings-status" role="status" aria-live="polite"></p>
    </form>
    <h2>Lokalizacja nasłuchu</h2>
    <p class="soft">Miejsce mikrofonu używane do rozpoznawania ptaków, samolotów, pociągów i pogody. Zmiana dotyczy tego samego nasłuchu i jego publikacji. Dotychczasowy dziennik zostaje zachowany.</p>
    <form id="locationForm">
      <fieldset class="location-fields">
        <label for="locationCoordinates">Współrzędne GPS: szerokość, długość</label>
        <input id="locationCoordinates" name="coordinates" type="text" required spellcheck="false" autocomplete="off" aria-describedby="locationHint locationStatus" placeholder="54.352, 18.646">
        <p id="locationHint" class="soft">Wpisz lub wklej parę z mapy, z kropką dziesiętną. Dokładne współrzędne nie są publikowane.</p>
        <div class="location-actions"><button type="submit">Zapisz lokalizację</button><button type="button" data-location-device>Użyj lokalizacji tego urządzenia</button><button type="reset">Cofnij</button></div>
      </fieldset>
      <p id="locationStatus" class="soft settings-status" role="status" aria-live="polite"></p>
    </form>
    <h2>Samsung The Frame</h2>${toggle('frame_on', 'Wysyłaj rycinę na telewizor')}
    <label class="set">Adres IP telewizora<input id="setting_frame_host" value="${esc(s.frame_host || '')}" placeholder="np. 192.168.1.14" onchange="save({frame_host: this.value.trim()})"></label>
    ${slider('frame_every_min', 'Nie częściej niż co (min)', 1, 60, 1)}
    <p class="soft" id="frameStatus"></p>
    <p><button class="act" onclick="framePush()">Wyślij teraz</button> <button class="act" onclick="frameRestore()">Przywróć sztukę z telewizora</button> <a class="act" href="api/tv.jpg" target="_blank">Podgląd</a></p>
    <p class="soft">Telewizor pokazuje rycinę tego, co słychać, z opisem (ptaki: z Wikipedii) i kolumnę statystyk. Zmienia ją przy nowym dźwięku, nie częściej niż co tyle minut, i co 30 min odświeża statystyki. Przy pierwszym razie telewizor zapyta pilotem, czy wpuścić „Ryciny”. Jeśli telefon też wysyła na telewizor, wyłącz to w aplikacji.</p>
    <h2>Mikrofon</h2>${slider('mic_gain_db', 'Wzmocnienie (dB)', 0, 36, 1)}<p class="soft">Gdy przelatujący blisko samolot daje na pasku poziomu mniej niż ok. -40 dB, YAMNet go nie rozpozna. Zwykle 12–24 dB; za dużo daje fałszywe dźwięki w ciszy.</p>
    <h2>Ptaki</h2>${slider('bird_threshold', 'Minimalna pewność BirdNET', .3, .95, .01, pct)}${toggle('range_filter', 'Tylko gatunki występujące tu o tej porze roku')}
    <h2>Psy</h2>${slider('bark_threshold', 'Próg szczekania', .1, .9, .01, pct)}${slider('dog_match', 'Dopasowanie do znanego psa', .6, .98, .01, pct)}
    <h2>Samoloty</h2>${slider('radius_km', 'Promień (km)', 3, 60, 1)}${slider('overhead_max_alt_m', '„Nad głową” poniżej (m)', 500, 12000, 250)}
    <h2>Pociągi</h2>${toggle('trains', 'Rozpoznawaj pociągi z rozkładu PKP PLK')}
    <h2>Rycina</h2>${slider('lookback_hours', 'Pokazuj ostatnie (godz.)', 1, 72, 1)}
    ${slider('art_daily_limit', 'Najwyżej płatnych rycin na dobę (0 = bez limitu)', 0, 200, 5)}
    <label class="set">Generowanie rycin<select id="setting_image_provider" onchange="save({image_provider: this.value})">${['openai', 'gemini', 'openrouter', 'none'].map(p => `<option ${p === s.image_provider ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
    <p class="soft">${s.providerReady ? 'Klucz dla wybranego dostawcy jest ustawiony.' : 'Brak klucza: wpisz go w konfiguracji dodatku (Ustawienia → Dodatki → Ryciny → Konfiguracja).'}</p>
    <h2>Animowana rycina</h2>
    ${toggle('animation_playback', 'Odtwarzaj animacje')}
    ${toggle('prefer_bundled_art', 'Ryciny z gotowymi animacjami zamiast własnych')}
    <p class="soft">Kot, pszczoły, pociąg i inne tematy z gotowych paczek dostaną ich rycinę, żeby animacja pasowała. Własne ryciny zostają na dysku; wyłączenie przywraca je.</p>
    ${toggle('animation_generate', 'Generuj animacje dla istniejących i nowych rycin')}
    <label class="set">Model generowania animacji<select id="setting_animation_model" onchange="save({animation_model: this.value})">${modelOptions.map(([value, label]) => `<option value="${esc(value)}" ${value === currentModel ? 'selected' : ''}>${esc(label)}</option>`).join('')}</select></label>
    <p class="soft" id="animationGenerationStatus">${esc(animationGenerationMessage(s))}</p>
    <p class="soft">Główna rycina odtwarza animację automatycznie, gdy odtwarzanie jest włączone. Przy wyłączeniu animacji lub ograniczeniu ruchu pozostaje statyczna.</p>
    <h2>Dźwięki okolicy</h2><p class="soft">Wyłączone nie są zapisywane i znikają z ryciny i Dziennika.</p>
    ${list.map(x => `<label class="set">${esc(x.now)}<input type="checkbox" ${x.on ? 'checked' : ''} onchange="soundSwitch('${x.key}', this.checked)"></label>`).join('')}
    <h2>Na dashboardzie Home Assistant</h2>
    <p class="soft">Pełny, animowany widok Ryciny działa w tym panelu webowym i w bocznym menu dodatku. Na dashboardzie Home Assistant możesz osadzić adres webowy dodatku w karcie „Webpage”/iframe; wymaga to osiągalności adresu i odpowiedniej konfiguracji osadzania w HA. Opcjonalnie adres <code>http://&lt;adres HA&gt;:8099/api/plate.png?w=1600&h=900</code> służy jako statyczny obraz dla Generic Camera/Picture entity. Samsung Art Mode również pozostaje statyczny.</p>
    <p class="soft">Dodatek ${esc(s.version)} · lokalizacja <span id="savedLocation">${s.lat.toFixed(3)}, ${s.lon.toFixed(3)}</span></p>`;
  syncSettingsControls(s);
  window.RycinyLocation.bind($('#locationForm'), s, save, window.isSecureContext ? navigator.geolocation : null);
  window.RycinyLocation.bindTitle($('#stationTitleForm'), s, save);
}

function save(values) {
  settingsSaveTail = settingsSaveTail.catch(() => null).then(async () => {
    /*
     * Serialize autosaves so a slower earlier PUT cannot overwrite a newer
     * control state; every successful response remains the source of truth.
     */

    setSettingsStatus('Zapisywanie…');
    try {
      const state = await api('api/settings', {method: 'PUT', body: JSON.stringify(values)});
      syncSettingsControls(state);
      version = -1;
      if (Object.prototype.hasOwnProperty.call(values, 'animation_playback')) {
        const enabled = Object.prototype.hasOwnProperty.call(state || {}, 'animation_playback')
          ? Boolean(state.animation_playback)
          : Boolean(values.animation_playback);
        applyAnimationPlayback(enabled);
      }
      setSettingsStatus('Ustawienia zapisane.');
      return state;
    } catch (error) {
      try { syncSettingsControls(await api('api/settings')); } catch (_) { }
      setSettingsStatus('Nie udało się zapisać ustawienia. Spróbuj ponownie.', true);
      return null;
    }
  });
  return settingsSaveTail;
}
async function soundSwitch(key, on) {
  const s = await api('api/settings');
  const off = new Set(s.sounds_off), onSet = new Set(s.sounds_on);
  if (on) { off.delete(key); onSet.add(key); } else { onSet.delete(key); off.add(key); }
  const state = await save({sounds_off: [...off], sounds_on: [...onSet]});
  if (state && sounds[key]) sounds[key].on = on;
}

(async () => {
  breeds = await api('api/breeds');
  (await api('api/sounds')).forEach(s => sounds[s.key] = s);
  show(['plate', 'journal', 'stats', 'settings'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'plate');
  tick();
  pollTimer = setInterval(tick, 3000);
})();

window.addEventListener('pagehide', () => {
  if (pollTimer) clearInterval(pollTimer);
  plateAnimation.dispose();
  elementAnimations.dispose();
});

// Statystyki: the same numbers as the public page and the app (api/stats).
async function renderStats() {
  const s = await api('api/stats');
  const stat = (v, l) => `<div class="stat"><b>${v}</b>${l}</div>`;
  const pct = p => Math.round(p * 100) + '%';
  const conf = c => c != null ? `<div class="d">śr. pewność BirdNET ${pct(c)}</div>` : '';
  // The most confident recording of each species ever (kept for good), with its BirdNET score.
  const best = s.birds.best || {};
  const bestLine = sci => best[sci] ? `<div class="d">najlepsze nagranie: ${pct(best[sci].conf)}, ${day(best[sci].at)} ${play(best[sci].clip, true)}</div>` : '';
  const bird = (sci, name) => `${art('BIRD', sci, sci)}<div class="t">${esc(name.charAt(0).toUpperCase() + name.slice(1))}${bestLine(sci)}`;
  const max = Math.max(1, ...s.birds.top.map(t => t.count)), hm = Math.max(1, ...s.birds.hours);
  elementAnimations.stopAll();
  $('#stats').innerHTML = `
    <h2>Ptaki</h2><div class="stats">${stat(s.birds.today, 'gatunków dziś')}${stat(s.birds.week, 'gatunków w 7 dni')}${stat(s.birds.month, 'gatunków w 30 dni')}</div>
    <h2>Szansa usłyszenia teraz (${s.hour}:00–${s.hour + 1}:00)</h2>
    <p class="soft">Na ilu z ${s.daysObserved} ostatnich dni nasłuchu dany ptak odezwał się o tej godzinie.</p>
    ${s.birds.chanceNow.map(c => `<div class="row">${bird(c.sci, c.name)}${conf(c.conf)}<div class="bar" style="width:${Math.max(3, c.now * 100)}%"></div></div><b>${pct(c.now)}</b></div>`).join('') || '<p class="soft">O tej godzinie jeszcze nic nie było słychać.</p>'}
    <h2>Szansa usłyszenia w ciągu dnia</h2>
    ${s.birds.chanceDay.map(c => `<div class="row">${bird(c.sci, c.name)}<div class="d">najczęściej ok. ${c.bestHour}:00${c.conf != null ? ' · śr. pewność BirdNET ' + pct(c.conf) : ''}</div><div class="bar" style="width:${Math.max(3, c.day * 100)}%"></div></div><b>${pct(c.day)}</b></div>`).join('') || '<p class="soft">Za mało danych.</p>'}
    <h2>Najczęściej słyszane (7 dni)</h2>
    ${s.birds.top.map(t => `<div class="row">${bird(t.sci, t.name)}<div class="bar" style="width:${Math.max(3, 100 * t.count / max)}%"></div></div><span class="soft">${t.count}×</span></div>`).join('')}
    <h2>Średnia pewność BirdNET (30 dni)</h2>
    <p class="soft">Jak bardzo model był pewny, że to ten gatunek, średnio ze wszystkich wykryć. Niska średnia przy rzadkim gatunku to znak, że mogła to być pomyłka.</p>
    ${(s.birds.confidence || []).map(c => `<div class="row">${bird(c.sci, c.name)}<div class="d">${c.count} wykryć</div><div class="bar" style="width:${Math.max(3, c.conf * 100)}%"></div></div><b>${pct(c.conf)}</b></div>`).join('') || '<p class="soft">Za mało danych.</p>'}
    <h2>Ptaki według godziny (7 dni)</h2>
    <div class="hours">${s.birds.hours.map((v, h) => `<div title="${h}:00 · ${v}×" style="height:${100 * v / hm}%"></div>`).join('')}</div>
    <div class="hlab"><span>0:00</span><span>6:00</span><span>12:00</span><span>18:00</span><span>23:00</span></div>
    <h2>Samoloty</h2><div class="stats">${stat(s.planes.today, 'usłyszanych dziś')}${stat(s.planes.week, 'w 7 dni')}${stat(s.planes.airlinesToday, 'linii lotniczych dziś')}</div>
    <h2>Dźwięki okolicy</h2><div class="stats">${stat(s.sounds.kindsToday, 'rodzajów dziś')}${stat(s.sounds.trainsToday, 'pociągów dziś')}${stat(s.sounds.week, 'zdarzeń w 7 dni')}</div>`;
  elementAnimations.refresh($('#stats'));
}

async function frameStatus() {
  const f = await api('api/frame');
  const el = $('#frameStatus');
  if (el) el.textContent = (f.status || (f.paired ? 'połączony z telewizorem' : 'jeszcze nie połączony')) + (f.sentAt ? ' · ostatnio wysłano ' + hhmm(f.sentAt) : '');
}
async function framePush() { $('#frameStatus').textContent = 'wysyłam… (jeśli telewizor zapyta, zezwól pilotem)'; await api('api/frame/push', {method: 'POST', body: '{}'}).catch(() => {}); frameStatus(); }
async function frameRestore() { $('#frameStatus').textContent = 'przywracam…'; await api('api/frame/restore', {method: 'POST', body: '{}'}).catch(() => {}); frameStatus(); }
</script>
